<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meal Nutrition Analyzer</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    .danger { color: #b00020; }
    .result { background: #f6f6f9; border-radius: 10px; padding: 1rem 1.25rem; margin-top: 1.5rem; }
    input[type=text] { width: 100%; padding: .5rem; margin: .5rem 0; }
  </style>
</head>
<body>
  <h1>Meal Nutrition Analyzer</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="{{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  <form action="{{ url_for('index') }}" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept="image/*" required>
    <input type="text" name="user_query" placeholder="Optional question, e.g. How healthy is this meal?">
    <button type="submit">Analyze</button>
  </form>

  {% if response %}
    <div class="result">
      {% if user_query %}<p><em>{{ user_query }}</em></p>{% endif %}
      {{ response|safe }}
    </div>
  {% endif %}
</body>
</html>
